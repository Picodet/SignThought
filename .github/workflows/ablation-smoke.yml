name: Ablation smoke checks

on:
  push:
    branches:
      - "ablation/**"
  pull_request:
    branches:
      - main

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m compileall -q main
      - run: python -m pip install pyyaml
      - run: python -m unittest tests.test_ablation_configs
